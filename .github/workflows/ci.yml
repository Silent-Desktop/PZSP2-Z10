name: CI

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Install uv
              run: pip install uv

            - name: Sync dependencies
              run: uv sync

            - name: Lint with ruff
              run: uv run ruff check src exploration/notebooks/2-tensor-evo-with-lib.ipynb tests

            - name: Run tests
              run: uv run pytest tests/
