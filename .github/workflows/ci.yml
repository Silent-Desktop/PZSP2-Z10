name: CI

on:
    push:
    pull_request:
    workflow_dispatch:
jobs:
    test-lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Install uv
              run: pip install uv

            - name: Cache uv dependencies
              uses: actions/cache@v4
              with:
                  path: ~/.cache/uv
                  key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
                  restore-keys: |
                      uv-${{ runner.os }}-

            - name: Sync dependencies
              run: uv sync --frozen

            - name: Lint with ruff
              run: uv run ruff check src NetworkEvolution.ipynb tests

            - name: Run tests
              run: uv run pytest tests/
