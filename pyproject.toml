[project]
name = "net_opt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Adam Szokalski", email = "szokalskiadam@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "ampl-module-base>=20250901",
    "ampl-module-cplex>=20251210",
    "amplpy>=0.16.0",
    "beartype>=0.22.9",
    "ipykernel>=7.1.0",
    "jaxtyping>=0.3.5",
    "matplotlib>=3.10.8",
    "matplotlib-inline>=0.2.1",
    "networkx>=3.6.1",
    "numpy>=2.4.0",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "pytest-cov>=7.0.0",
    "torch>=2.9.1",
]

[project.scripts]
net_opt = "net_opt:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.14.0"]

[[tool.uv.index]]
name = "ampl"
url = "https://pypi.ampl.com/"

[tool.ruff]
lint.extend-ignore = [
    "F722", # Wrokaround: https://docs.kidger.site/jaxtyping/faq/
    "F821", # Wrokaround: https://docs.kidger.site/jaxtyping/faq/
]

[tool.uv.sources]
ampl-module-base = { index = "ampl" }
ampl-module-cplex = { index = "ampl" }
